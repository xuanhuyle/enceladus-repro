[project]
name = "enceladus-repro"
version = "0.1.0"
description = "Independent reproduction of the Postberg et al. 2023 phosphate detection from public Cassini CDA archive data"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pdr>=1.4",         # PDS3/PDS4 product reader — parses CDA labels and tables
    "numpy>=1.26",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pypdf>=4.0",       # text/table extraction from the target paper PDF (kill-test 1)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
